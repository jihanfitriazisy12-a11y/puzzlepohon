<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ayo Susun Puzzle Pohon! - 15 Variasi Pohon Presisi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Baloo 2', cursive;
            margin: 0;
            overflow: hidden;
            background-color: #70c6f4;
            touch-action: none;
            user-select: none;
        }

        /* Scenery Background */
        .sun {
            position: absolute;
            top: 3%;
            right: 6%;
            width: 90px;
            height: 90px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 50px #FFD700, 0 0 20px #FFA500;
            animation: pulse-sun 3s infinite alternate ease-in-out;
        }
        
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50px;
            opacity: 0.9;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 { width: 140px; height: 45px; top: 6%; left: 8%; animation: float 14s infinite alternate linear; }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud1::after { width: 70px; height: 70px; top: -35px; right: 20px; }
        
        .cloud2 { width: 170px; height: 55px; top: 12%; right: 20%; animation: float 16s infinite alternate-reverse linear; }
        .cloud2::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        .cloud2::after { width: 80px; height: 80px; top: -45px; right: 25px; }

        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 26vh;
            background: linear-gradient(to bottom, #76e026, #38b000);
            border-top-left-radius: 50% 30px;
            border-top-right-radius: 50% 30px;
            z-index: 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
        }

        /* Confetti */
        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            z-index: 100;
            animation: fall linear forwards;
            border-radius: 3px;
        }

        @keyframes float {
            0% { transform: translateX(0); }
            100% { transform: translateX(40px); }
        }
        @keyframes pulse-sun {
            0% { transform: scale(1); box-shadow: 0 0 30px #FFD700; }
            100% { transform: scale(1.15); box-shadow: 0 0 60px #FFD700, 0 0 30px #FFA500; }
        }
        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pop-part {
            0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.08); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        @keyframes celebrate-bounce {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.1) rotate(5deg); }
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }
        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .animate-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-pop-part { animation: pop-part 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-celebrate { animation: celebrate-bounce 0.8s infinite ease-in-out; }

        .btn-hover { transition: all 0.2s; }
        .btn-hover:active { transform: scale(0.92); }
        
        .puzzle-piece {
            position: absolute;
            cursor: pointer;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.25));
            z-index: 10;
        }
        .puzzle-target {
            position: absolute;
            z-index: 1;
            transition: opacity 0.3s;
        }
        
        /* Educational Mode Tooltip */
        .edu-label {
            position: absolute;
            background: white;
            border: 4px solid #FF9800;
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 1.25rem;
            font-weight: bold;
            color: #333;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            cursor: pointer;
            z-index: 30;
            animation: pop 0.3s ease-out forwards;
        }

        .svg-part { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative overflow-hidden text-gray-800">

    <!-- Scenery Background -->
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="grass"></div>

    <!-- START SCREEN -->
    <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-black/30 backdrop-blur-sm transition-opacity duration-500">
        <div class="bg-white/95 p-6 md:p-8 rounded-3xl shadow-2xl border-4 border-green-500 text-center animate-pop max-w-xl w-11/12 flex flex-col items-center">
            <h1 class="text-3xl md:text-5xl font-extrabold text-green-600 mb-2 drop-shadow-md">🌳 Ayo Susun Puzzle Pohon! 🌳</h1>
            <p class="text-lg md:text-xl text-gray-600 mb-6 font-semibold">Tersedia 15 Pohon Unik & Presisi untuk Dipasang!</p>
            
            <button onclick="startGame(0)" class="bg-gradient-to-b from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-white text-2xl md:text-3xl font-extrabold py-4 px-10 rounded-full shadow-[0_8px_0_#b47b00] active:shadow-[0_2px_0_#b47b00] active:translate-y-1 btn-hover mb-4" style="animation: pulse-btn 1.8s infinite;">
                ▶ Mulai dari Pohon 1
            </button>
            
            <button onclick="toggleSelectModal()" class="bg-gradient-to-b from-blue-400 to-indigo-600 text-white text-lg font-bold py-2.5 px-6 rounded-full shadow-md btn-hover">
                🎨 Pilih Dari 15 Pohon
            </button>
        </div>
    </div>

    <!-- TREE SELECTOR MODAL -->
    <div id="select-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-md">
        <div class="bg-white/95 border-4 border-amber-400 p-6 rounded-3xl shadow-2xl max-w-2xl w-11/12 max-h-[85vh] flex flex-col items-center animate-pop">
            <h2 class="text-2xl md:text-3xl font-extrabold text-amber-600 mb-4">🌳 Pilih 1 Dari 15 Pohon 🌳</h2>
            <div id="tree-grid" class="grid grid-cols-3 sm:grid-cols-5 gap-3 w-full overflow-y-auto p-2 max-h-[60vh]">
                <!-- Grid buttons dynamically injected -->
            </div>
            <button onclick="toggleSelectModal()" class="mt-4 bg-gray-500 text-white font-bold py-2 px-8 rounded-full btn-hover">
                Tutup
            </button>
        </div>
    </div>

    <!-- GAME CONTAINER -->
    <div id="game-container" class="hidden absolute inset-0 w-full h-full flex flex-col z-10">
        
        <!-- Header Controls -->
        <div class="w-full h-[12%] flex justify-between items-center px-4 md:px-6 pt-3 relative z-20">
            <button onclick="toggleSelectModal()" id="tree-indicator" class="bg-white/90 px-5 py-2 rounded-full font-extrabold text-lg md:text-xl text-blue-600 shadow-md border-2 border-blue-400 btn-hover">
                🌳 Pohon 1/15
            </button>
            <div id="instruction-text" class="bg-white/90 px-4 py-2 rounded-full font-bold text-base md:text-lg text-gray-700 shadow-md border-2 border-gray-300 hidden sm:block text-center flex-1 mx-4">
                Tarik potongan puzzle ke posisi pohon yang pas!
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSelectModal()" class="bg-blue-400 hover:bg-blue-500 text-white w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-xl shadow-md btn-hover border-2 border-white" title="Pilih Pohon">
                    📋
                </button>
                <button id="music-btn" onclick="toggleMusic()" class="bg-amber-400 hover:bg-amber-500 text-white w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-xl shadow-md btn-hover border-2 border-white">
                    🎵
                </button>
            </div>
        </div>

        <!-- Tree Canvas (Middle Area) -->
        <div id="tree-canvas" class="relative w-full h-[65%] max-w-2xl mx-auto flex items-center justify-center">
            <!-- Adjusted Canvas Container 340x500 to allow taller tree structure -->
            <div id="tree-wrapper" class="relative w-[340px] h-[500px] transform origin-bottom scale-[0.72] sm:scale-95">
                <!-- Targets and Correct pieces generated dynamically -->
            </div>
        </div>

        <!-- Pieces Tray (Bottom Area) -->
        <div id="pieces-tray" class="absolute bottom-0 w-full h-[23%] bg-yellow-100/95 border-t-4 border-yellow-400 shadow-[0_-8px_20px_rgba(0,0,0,0.15)] flex justify-around items-center px-2 z-20 rounded-t-3xl backdrop-blur-sm">
            <!-- Draggable pieces -->
        </div>

        <!-- Edu Controls -->
        <div id="edu-controls" class="hidden absolute bottom-6 w-full flex justify-center z-30">
            <button onclick="triggerNextTree()" id="next-tree-btn" class="bg-gradient-to-b from-green-400 to-emerald-600 text-white text-xl md:text-2xl font-black py-3 px-8 rounded-full shadow-[0_6px_0_#1b5e20] active:shadow-[0_2px_0_#1b5e20] active:translate-y-1 btn-hover animate-pop">
                Pohon Berikutnya ➔
            </button>
        </div>
    </div>

    <!-- CELEBRATION MODAL OVERLAY -->
    <div id="celebration-modal" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-md">
        <div class="bg-white/95 border-8 border-yellow-400 p-6 md:p-8 rounded-3xl shadow-2xl text-center max-w-md w-11/12 animate-pop flex flex-col items-center">
            <div class="text-6xl md:text-7xl mb-2 animate-celebrate">🏆</div>
            <h2 id="celeb-title" class="text-3xl md:text-4xl font-extrabold text-amber-500 mb-1 drop-shadow">HEBAT PINTAR!</h2>
            <p id="celeb-subtitle" class="text-xl md:text-2xl font-bold text-green-600 mb-5">Kamu Berhasil Menyusun Pohon!</p>
            <button onclick="closeCelebrationModal()" class="bg-gradient-to-b from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-white text-xl font-extrabold py-3 px-8 rounded-full shadow-[0_6px_0_#b47b00] active:translate-y-1 btn-hover">
                Pelajari Pohon ➔
            </button>
        </div>
    </div>

    <!-- Feedback Banner Overlay -->
    <div id="msg-overlay" class="hidden absolute inset-0 z-40 flex items-center justify-center pointer-events-none">
        <div id="msg-box" class="bg-white text-2xl md:text-3xl font-extrabold text-center px-8 py-4 rounded-3xl shadow-2xl border-4 transition-transform transform scale-0">
            <!-- Message -->
        </div>
    </div>

<script>
    // --- AUDIO & MUSIC ENGINE (Web Audio API) ---
    let audioCtx = null;
    let isMusicPlaying = false;
    let musicInterval = null;
    let musicStep = 0;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    const bgMelody = [
        261.63, 329.63, 392.00, 523.25, 392.00, 329.63,
        293.66, 349.23, 440.00, 523.25, 440.00, 349.23,
        329.63, 392.00, 523.25, 659.25, 523.25, 392.00,
        392.00, 440.00, 493.88, 523.25, 587.33, 523.25
    ];

    function playSoundTone(freq, duration, type = 'sine', gainVal = 0.1) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    function toggleMusic() {
        initAudio();
        const btn = document.getElementById('music-btn');
        if (isMusicPlaying) {
            stopMusic();
            btn.innerText = '🔇';
        } else {
            startMusic();
            btn.innerText = '🎵';
        }
    }

    function startMusic() {
        if (isMusicPlaying) return;
        isMusicPlaying = true;
        musicStep = 0;
        musicInterval = setInterval(() => {
            if (!isMusicPlaying) return;
            const freq = bgMelody[musicStep % bgMelody.length];
            playSoundTone(freq, 0.25, 'triangle', 0.04);
            if (musicStep % 4 === 0) {
                playSoundTone(freq / 2, 0.4, 'sine', 0.05);
            }
            musicStep++;
        }, 320);
    }

    function stopMusic() {
        isMusicPlaying = false;
        if (musicInterval) clearInterval(musicInterval);
    }

    function playFanfare() {
        initAudio();
        const fanfareNotes = [523.25, 659.25, 783.99, 1046.50];
        fanfareNotes.forEach((freq, idx) => {
            setTimeout(() => {
                playSoundTone(freq, 0.4, 'triangle', 0.15);
            }, idx * 150);
        });
    }

    // --- SPEECH SYNTHESIS ---
    const synth = window.speechSynthesis;
    let voiceIndo = null;

    function initSpeech() {
        if (!synth) return;
        const voices = synth.getVoices();
        voiceIndo = voices.find(v => v.lang === 'id-ID' || v.lang === 'id_ID');
    }
    if (speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = initSpeech;
    }

    function speak(text) {
        if (!synth) return;
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        if (voiceIndo) utterance.voice = voiceIndo;
        utterance.lang = 'id-ID';
        utterance.rate = 0.95;
        utterance.pitch = 1.15;
        synth.speak(utterance);
    }

    // --- GAME STATE ---
    let currentTreeIndex = 0;
    let placedCount = 0;
    let isEduMode = false;
    let draggedPiece = null;
    let initialX, initialY, currentX, currentY, xOffset = 0, yOffset = 0;

    const ALL_PARTS_KEYS = ['akar', 'batang', 'ranting', 'daun', 'buah'];

    // --- REUSABLE BASE BUILDERS WITH FIXED PRECISION TARGET COORDINATES ---
    // Ground level base: 
    // Akar: Top 390px (Positioned down on grass/ground)
    // Batang: Top 270px (Seamless connection with root base)
    // Ranting: Top 120px (Shifted up onto the upper trunk)
    // Daun & Buah: Top 70px (Elevated canopy for higher foliage)
    
    function makeAkarSVG(cMain = "#5D4037", cLine = "#3E2723") {
        return `<path d="M 70,0 
            C 70,35 40,65 15,90 C 2,102 -5,115 -10,128 C 8,122 22,108 34,92 C 48,74 65,45 74,15 
            C 76,55 68,90 55,125 C 45,142 30,155 18,162 C 38,150 54,125 72,100 C 90,75 98,42 102,12
            C 106,42 114,75 132,100 C 150,125 166,150 186,162 C 174,155 159,142 149,125 C 136,90 128,55 130,15
            C 139,45 156,74 170,92 C 182,108 196,122 214,128 C 209,115 202,102 189,90 C 164,65 134,35 134,0 Z" fill="${cMain}"/>
            <path d="M 80,18 Q 50,65 12,105 M 92,30 Q 68,88 38,130 M 124,18 Q 154,65 192,105 M 112,30 Q 136,88 166,130" stroke="${cLine}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
    }

    function makeBatangSVG(cMain = "#5D4037", cLine = "#4E342E") {
        return `<path d="M 12,200 C 24,130 18,60 18,0 L 76,0 C 76,60 70,130 82,200 Z" fill="${cMain}"/>
            <path d="M 28,10 C 34,60 25,130 31,190 M 47,10 C 53,60 44,130 50,190 M 64,10 C 70,60 61,130 67,190" stroke="${cLine}" stroke-width="3.5" stroke-linecap="round" fill="none"/>`;
    }

    function makeRantingSVG(cMain = "#5D4037") {
        return `<path d="M 115,175 C 115,135 85,110 20,75 Q 35,60 60,72 C 85,84 118,120 125,120 L 125,95 C 105,72 80,35 92,20 Q 105,20 118,42 L 130,85 L 142,42 Q 155,20 168,20 C 180,35 155,72 135,95 L 135,120 C 142,120 175,84 200,72 Q 225,60 240,75 C 175,110 145,135 145,175 Z" fill="${cMain}"/>`;
    }

    function makeDaunSVG(cMain, cDark, cLight, style = 'fluffy') {
        if(style === 'palm') {
            return `<g transform="translate(170,135)">
                <path d="M0,0 Q-90,-70 -170,-10 Q-80,-35 0,0" fill="${cMain}"/>
                <path d="M0,0 Q90,-70 170,-10 Q80,-35 0,0" fill="${cMain}"/>
                <path d="M0,0 Q-125,-25 -160,55 Q-70,10 0,0" fill="${cLight}"/>
                <path d="M0,0 Q125,-25 160,55 Q70,10 0,0" fill="${cLight}"/>
                <path d="M0,0 Q-100,70 -115,125 Q-45,45 0,0" fill="${cDark}"/>
                <path d="M0,0 Q100,70 115,125 Q45,45 0,0" fill="${cDark}"/>
            </g>`;
        }
        if(style === 'pine') {
            return `<g>
                <polygon points="170,10 60,105 280,105" fill="${cDark}"/>
                <polygon points="170,70 70,170 270,170" fill="${cMain}"/>
                <polygon points="170,135 80,235 260,235" fill="${cLight}"/>
            </g>`;
        }
        // Classic Fluffy Cloud-like Canopy
        return `<g>
            <circle cx="170" cy="145" r="120" fill="${cDark}"/>
            <circle cx="95" cy="135" r="90" fill="${cDark}"/>
            <circle cx="245" cy="135" r="90" fill="${cDark}"/>
            <circle cx="170" cy="115" r="115" fill="${cMain}"/>
            <circle cx="85" cy="120" r="85" fill="${cMain}"/>
            <circle cx="255" cy="120" r="85" fill="${cMain}"/>
            <circle cx="125" cy="65" r="75" fill="${cMain}"/>
            <circle cx="215" cy="65" r="75" fill="${cMain}"/>
            <circle cx="160" cy="90" r="95" fill="${cLight}"/>
            <circle cx="90" cy="95" r="65" fill="${cLight}"/>
            <circle cx="240" cy="95" r="65" fill="${cLight}"/>
            <circle cx="125" cy="50" r="55" fill="${cLight}"/>
            <circle cx="205" cy="50" r="55" fill="${cLight}"/>
        </g>`;
    }

    function createPart(id, name, info, svgContent, width, height, top, left, z) {
        return {
            id, name, info, 
            svg: `<svg viewBox="0 0 ${width} ${height}" class="svg-part">${svgContent}</svg>`,
            width, height, targetTop: top, targetLeft: left, targetTransform: 'translate(-50%, -50%)', zIndex: z
        };
    }

    // --- 15 UNIQUE TREES DATA WITH FIXED PRECISION TOP COORDINATES ---
    // Top Coordinates: Akar=390px, Batang=270px, Ranting=120px, Daun=70px, Buah=70px
    const treesData = [
        {
            id: 'apel', name: '1. Pohon Apel Merah',
            parts: {
                'akar': createPart('akar', 'Akar', 'Akar menancap dalam di tanah menyerap air.', makeAkarSVG('#5D4037', '#3E2723'), 204, 165, '390px', '170px', 4),
                'batang': createPart('batang', 'Batang', 'Batang menopang pohon berdiri tinggi.', makeBatangSVG('#5D4037', '#4E342E'), 94, 200, '270px', '170px', 2),
                'ranting': createPart('ranting', 'Ranting', 'Ranting memegang daun dan buah apel.', makeRantingSVG('#5D4037'), 260, 180, '120px', '170px', 3),
                'daun': createPart('daun', 'Daun Rimbun', 'Daun memasak makanan dengan matahari.', makeDaunSVG('#2e7d32', '#1b5e20', '#4caf50'), 340, 270, '70px', '170px', 1),
                'buah': createPart('buah', 'Buah Apel', 'Buah apel manis berwarna merah segar!', 
                    `<g transform="translate(70,90)"><circle cx="18" cy="18" r="18" fill="#e53935"/><circle cx="12" cy="12" r="6" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(245,105)"><circle cx="18" cy="18" r="18" fill="#e53935"/><circle cx="12" cy="12" r="6" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(155,40)"><circle cx="18" cy="18" r="18" fill="#e53935"/><circle cx="12" cy="12" r="6" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(115,175)"><circle cx="18" cy="18" r="18" fill="#e53935"/><circle cx="12" cy="12" r="6" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(210,180)"><circle cx="18" cy="18" r="18" fill="#e53935"/><circle cx="12" cy="12" r="6" fill="#fff" opacity="0.45"/></g>`, 340, 270, '70px', '170px', 5)
            }
        },
        {
            id: 'mangga', name: '2. Pohon Mangga',
            parts: {
                'akar': createPart('akar', 'Akar', 'Akar menjalar kuat menahan angin.', makeAkarSVG('#4E342E', '#2A1B18'), 204, 165, '390px', '170px', 4),
                'batang': createPart('batang', 'Batang', 'Batang mangga yang kokoh dan tebal.', makeBatangSVG('#4E342E', '#3E2723'), 94, 200, '270px', '170px', 2),
                'ranting': createPart('ranting', 'Ranting', 'Ranting menahan beratnya buah mangga.', makeRantingSVG('#4E342E'), 260, 180, '120px', '170px', 3),
                'daun': createPart('daun', 'Daun Hijau', 'Daun mangga yang hijau dan lebat.', makeDaunSVG('#388e3c', '#1b5e20', '#66bb6a'), 340, 270, '70px', '170px', 1),
                'buah': createPart('buah', 'Buah Mangga', 'Mangga kuning manis kaya vitamin!', 
                    `<g transform="translate(65,85)"><ellipse cx="18" cy="24" rx="15" ry="22" fill="#ffc107"/><circle cx="13" cy="15" r="5" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(250,110)"><ellipse cx="18" cy="24" rx="15" ry="22" fill="#ffc107"/><circle cx="13" cy="15" r="5" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(155,45)"><ellipse cx="18" cy="24" rx="15" ry="22" fill="#ffc107"/><circle cx="13" cy="15" r="5" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(120,180)"><ellipse cx="18" cy="24" rx="15" ry="22" fill="#ffb300"/><circle cx="13" cy="15" r="5" fill="#fff" opacity="0.45"/></g>
                     <g transform="translate(215,175)"><ellipse cx="18" cy="24" rx="15" ry="22" fill="#ffc107"/><circle cx="13" cy="15" r="5" fill="#fff" opacity="0.45"/></g>`, 340, 270, '70px', '170px', 5)
            }
        },
        {
            id: 'jeruk', name: '3. Pohon Jeruk',

    // --- GAME CONTROL FUNCTIONS ---
    function renderGridSelector() {
        const grid = document.getElementById('tree-grid');
        grid.innerHTML = '';
        treesData.forEach((tree, idx) => {
            const btn = document.createElement('button');
            btn.className = 'bg-yellow-100 hover:bg-yellow-200 border-2 border-amber-400 text-amber-900 font-bold py-3 px-2 rounded-2xl text-center shadow flex flex-col items-center justify-center btn-hover';
            btn.innerHTML = `<span class="text-2xl mb-1">🌳</span><span class="text-xs font-black line-clamp-1">${tree.name.split('.')[1] || tree.name}</span>`;
            btn.onclick = () => {
                toggleSelectModal();
                startGame(idx);
            };
            grid.appendChild(btn);
        });
    }

    function toggleSelectModal() {
        const modal = document.getElementById('select-modal');
        if (modal.classList.contains('hidden')) {
            renderGridSelector();
            modal.classList.remove('hidden');
        } else {
            modal.classList.add('hidden');
        }
    }

    function startGame(treeIdx = 0) {
        initAudio();
        initSpeech();
        startMusic();
        document.getElementById('start-screen').classList.add('opacity-0');
        setTimeout(() => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            loadTree(treeIdx);
        }, 500);
    }

    function loadTree(index) {
        currentTreeIndex = index;
        const currentTree = treesData[currentTreeIndex];
        const currentTreeParts = currentTree.parts;
        
        placedCount = 0;
        isEduMode = false;

        document.getElementById('tree-indicator').innerText = `🌳 ${currentTree.name}`;
        document.getElementById('instruction-text').innerText = `Ayo susun ${currentTree.name}!`;
        document.getElementById('pieces-tray').innerHTML = '';
        
        const treeWrapper = document.getElementById('tree-wrapper');
        treeWrapper.innerHTML = '';
        
        document.getElementById('pieces-tray').classList.remove('hidden');
        document.getElementById('edu-controls').classList.add('hidden');
        
        speak(`Ayo kita susun ${currentTree.name}!`);

        const partsNeeded = ALL_PARTS_KEYS;
        const shuffledParts = [...partsNeeded].sort(() => Math.random() - 0.5);

        // Render silhouette targets
        partsNeeded.forEach(partId => {
            const partData = currentTreeParts[partId];
            const target = document.createElement('div');
            target.id = `target-${partId}`;
            target.className = 'puzzle-target';
            target.style.width = `${partData.width}px`;
            target.style.height = `${partData.height}px`;
            target.style.top = partData.targetTop;
            target.style.left = partData.targetLeft;
            target.style.transform = partData.targetTransform;
            target.style.zIndex = partData.zIndex;
            target.innerHTML = partData.svg;
            target.style.filter = "brightness(0) invert(0.65) opacity(0.45)";
            treeWrapper.appendChild(target);
        });

        // Render puzzle pieces tray
        shuffledParts.forEach(partId => {
            const partData = currentTreeParts[partId];
            const pieceContainer = document.createElement('div');
            pieceContainer.className = 'w-1/5 h-full flex items-center justify-center relative';
            
            const piece = document.createElement('div');
            piece.id = `piece-${partId}`;
            piece.className = 'puzzle-piece transition-transform hover:scale-105';
            piece.dataset.partId = partId;
            piece.style.width = `${partData.width * 0.52}px`;
            piece.style.height = `${partData.height * 0.52}px`;
            piece.innerHTML = partData.svg;
            
            setupDragEvents(piece);
            pieceContainer.appendChild(piece);
            document.getElementById('pieces-tray').appendChild(pieceContainer);
        });
    }

    // --- DRAG AND DROP HANDLERS ---
    function setupDragEvents(element) {
        element.addEventListener('touchstart', dragStart, {passive: false});
        element.addEventListener('touchend', dragEnd, {passive: false});
        element.addEventListener('touchmove', drag, {passive: false});
        element.addEventListener('mousedown', dragStart);
        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('mousemove', drag);
    }

    function dragStart(e) {
        if(isEduMode) return;
        const target = e.target.closest('.puzzle-piece');
        if(!target) return;
        
        draggedPiece = target;
        const partId = draggedPiece.dataset.partId;
        const currentTreeParts = treesData[currentTreeIndex].parts;
        
        playSoundTone(440, 0.1, 'sine', 0.1);
        speak(currentTreeParts[partId].name);

        if (e.type === "touchstart") {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
        } else {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
        }

        const rect = draggedPiece.getBoundingClientRect();
        
        if(draggedPiece.parentElement.id !== "tree-canvas") {
            draggedPiece.style.position = 'absolute';
            draggedPiece.style.width = `${currentTreeParts[partId].width}px`;
            draggedPiece.style.height = `${currentTreeParts[partId].height}px`;
            draggedPiece.style.left = rect.left + 'px';
            draggedPiece.style.top = rect.top + 'px';
            document.body.appendChild(draggedPiece);
            
            xOffset = 0;
            yOffset = 0;
            if (e.type === "touchstart") {
                initialX = e.touches[0].clientX - rect.left;
                initialY = e.touches[0].clientY - rect.top;
            } else {
                initialX = e.clientX - rect.left;
                initialY = e.clientY - rect.top;
            }
        }
        
        draggedPiece.style.transform = `scale(1.08)`;
        draggedPiece.style.transition = 'none';
        draggedPiece.style.zIndex = "100";
    }

    function drag(e) {
        if (!draggedPiece || isEduMode) return;
        e.preventDefault();

        if (e.type === "touchmove") {
            currentX = e.touches[0].clientX - initialX;
            currentY = e.touches[0].clientY - initialY;
        } else {
            currentX = e.clientX - initialX;
            currentY = e.clientY - initialY;
        }
        xOffset = currentX;
        yOffset = currentY;
        draggedPiece.style.left = `${currentX}px`;
        draggedPiece.style.top = `${currentY}px`;
    }

    function dragEnd() {
        if (!draggedPiece) return;
        
        const partId = draggedPiece.dataset.partId;
        const targetDrop = document.getElementById(`target-${partId}`);
        const pieceRect = draggedPiece.getBoundingClientRect();
        const targetRect = targetDrop.getBoundingClientRect();

        const overlapX = Math.max(0, Math.min(pieceRect.right, targetRect.right) - Math.max(pieceRect.left, targetRect.left));
        const overlapY = Math.max(0, Math.min(pieceRect.bottom, targetRect.bottom) - Math.max(pieceRect.top, targetRect.top));
        const overlapArea = overlapX * overlapY;
        const targetArea = targetRect.width * targetRect.height;

        if (overlapArea > (targetArea * 0.2)) {
            handleCorrectPlacement(draggedPiece, targetDrop, partId);
        } else {
            handleWrongPlacement(draggedPiece, partId);
        }

        draggedPiece = null;
        xOffset = 0;
        yOffset = 0;
    }

    function handleCorrectPlacement(piece, target, partId) {
        piece.remove();
        target.style.filter = "none";
        target.style.opacity = "1";
        target.classList.add('animate-pop-part', 'correct-part');
        target.dataset.partId = partId;

        playSoundTone(523.25, 0.15, 'sine', 0.2);
        setTimeout(() => playSoundTone(659.25, 0.25, 'sine', 0.2), 100);

        const currentTreeParts = treesData[currentTreeIndex].parts;
        const pujian = ["Bagus sekali!", "Pintar!", "Tepat sekali!", "Hebat sekali!"];
        const kataPujian = pujian[Math.floor(Math.random() * pujian.length)];
        speak(`${kataPujian} Ini adalah ${currentTreeParts[partId].name}.`);
        
        showBannerMessage(`⭐ ${kataPujian} ⭐`, "border-green-500", "text-green-600");

        placedCount++;
        if (placedCount === ALL_PARTS_KEYS.length) {
            setTimeout(treeComplete, 900);
        }
    }

    function handleWrongPlacement(piece, partId) {
        playSoundTone(220, 0.25, 'sawtooth', 0.08);
        piece.style.transition = 'all 0.4s ease-out';
        piece.style.transform = `scale(1)`;
        piece.style.zIndex = "10";
        
        const currentTreeParts = treesData[currentTreeIndex].parts;
        const trays = document.getElementById('pieces-tray').children;
        for(let t of trays) {
            if(t.children.length === 0) {
                piece.style.position = 'relative';
                piece.style.left = '0';
                piece.style.top = '0';
                piece.style.width = `${currentTreeParts[partId].width * 0.52}px`;
                piece.style.height = `${currentTreeParts[partId].height * 0.52}px`;
                t.appendChild(piece);
                break;
            }
        }
        speak("Ayo coba lagi, cari tempat yang pas ya!");
    }

    function showBannerMessage(text, borderColor, textColor) {
        const overlay = document.getElementById('msg-overlay');
        const box = document.getElementById('msg-box');
        
        box.className = `bg-white text-2xl md:text-3xl font-extrabold text-center px-8 py-4 rounded-3xl shadow-2xl border-4 ${borderColor} ${textColor} transition-transform transform scale-0`;
        box.innerText = text;
        
        overlay.classList.remove('hidden');
        setTimeout(() => box.classList.remove('scale-0'), 50);
        
        setTimeout(() => {
            box.classList.add('scale-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }, 1400);
    }

    function shootMassiveConfetti() {
        const colors = ['#ff0055', '#00e5ff', '#ffea00', '#76ff03', '#d500f9', '#ff9100'];
        for (let i = 0; i < 90; i++) {
            const conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.top = '-20px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
            conf.style.animationDelay = (Math.random() * 0.6) + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 4500);
        }
    }

    function treeComplete() {
        shootMassiveConfetti();
        playFanfare();
        isEduMode = true; 
        
        const currentTreeName = treesData[currentTreeIndex].name;
        
        const celebModal = document.getElementById('celebration-modal');
        const celebTitle = document.getElementById('celeb-title');
        const celebSubtitle = document.getElementById('celeb-subtitle');
        
        celebTitle.innerText = "🌟 HEBAT PINTAR! 🌟";
        celebSubtitle.innerText = `Kamu Berhasil Menyusun ${currentTreeName}!`;
        speak(`Horeee! Luar biasa! Kamu berhasil menyusun ${currentTreeName}!`);
        
        celebModal.classList.remove('hidden');

        document.getElementById('instruction-text').innerText = "Sentuh bagian pohon untuk belajar!";
        document.getElementById('pieces-tray').classList.add('hidden');
        document.getElementById('edu-controls').classList.remove('hidden');

        const parts = document.querySelectorAll('.correct-part');
        parts.forEach(p => {
            p.style.cursor = 'pointer';
            p.style.transition = 'transform 0.2s';
            p.addEventListener('mouseenter', () => p.style.transform = 'translate(-50%, -50%) scale(1.06)');
            p.addEventListener('mouseleave', () => p.style.transform = 'translate(-50%, -50%) scale(1)');
            p.addEventListener('click', showEduInfo);
            p.addEventListener('touchstart', (e) => { e.preventDefault(); showEduInfo(e); }, {passive: false});
        });

        const btn = document.getElementById('next-tree-btn');
        if (currentTreeIndex < treesData.length - 1) {
            btn.innerText = "🌟 Pohon Berikutnya ➔";
        } else {
            btn.innerText = "🏆 Main Lagi Dari Pohon 1 🏆";
        }
    }

    function closeCelebrationModal() {
        document.getElementById('celebration-modal').classList.add('hidden');
        speak("Sekarang, sentuh bagian pohon untuk belajar!");
    }

    function showEduInfo(e) {
        if(!isEduMode) return;
        const partId = e.currentTarget.dataset.partId;
        const partData = treesData[currentTreeIndex].parts[partId];
        
        playSoundTone(587.33, 0.15, 'sine', 0.15);
        speak(`${partData.name}. ${partData.info}`);

        let tooltip = document.getElementById('edu-tooltip');
        if(!tooltip) {
            tooltip = document.createElement('div');
            tooltip.id = 'edu-tooltip';
            tooltip.className = 'edu-label text-center max-w-xs';
            document.body.appendChild(tooltip);
        }

        tooltip.innerHTML = `<span class="text-xl text-green-600 block mb-1 font-black">${partData.name}</span>${partData.info}`;
        
        const rect = e.currentTarget.getBoundingClientRect();
        tooltip.style.left = `${Math.max(10, rect.left + rect.width/2 - 100)}px`;
        tooltip.style.top = `${Math.max(10, rect.top - 85)}px`;

        setTimeout(() => {
            if(tooltip && tooltip.parentNode) {
                tooltip.remove();
            }
        }, 4000);
    }

    function triggerNextTree() {
        if (currentTreeIndex < treesData.length - 1) {
            loadTree(currentTreeIndex + 1);
        } else {
            loadTree(0);
        }
    }
</script>
</body>
